services:
  postgres:
    image: postgres:16-alpine
    container_name: hcm-postgres
    environment:
      POSTGRES_DB: hcm
      POSTGRES_USER: hcm
      POSTGRES_PASSWORD: hcm
    ports:
      - "5433:5432"
    volumes:
      - hcm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcm -d hcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hcm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - hcm-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hcm-mailhog
    # SMTP on 1025 (Spring Mail target), web UI on 8025 for browsing captured mail.
    # Production swap: drop this service and point spring.mail.host at a real
    # SMTP provider (SendGrid / SES / Mailgun / Office365) via env override.
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v2/messages"]
      interval: 10s
      timeout: 3s
      retries: 5

  keycloak-pg:
    image: postgres:16-alpine
    container_name: hcm-keycloak-pg
    # Dedicated Postgres for Keycloak's auth state (PRD 14.6 hardening).
    # Kept separate from `hcm-postgres` so the IdP and the HCM data plane
    # have independent backup / retention / scaling decisions.
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      # 5434 to avoid conflicting with hcm-postgres on 5433.
      - "5434:5432"
    volumes:
      - hcm-keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: hcm-keycloak
    # Production `start` mode (was `start-dev` until milestone 23).
    # Image auto-runs the build phase when KC_DB / KC_HOSTNAME etc. change.
    command:
      - start
      - --import-realm
      - --http-port=8090
      # Theme cache disabled in dev so iterating on the Millers theme
      # (./keycloak/themes/millers) doesn't require a container restart
      # for every CSS tweak. Production should drop these flags so the
      # default in-memory cache kicks in.
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    depends_on:
      keycloak-pg:
        condition: service_healthy
    environment:
      # Bootstrap admin in the master realm.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # --- Persistence ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://hcm-keycloak-pg:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # --- Hostname / HTTP ---
      # Keycloak advertises itself at the SPA's origin so the login
      # form's action attribute, redirect URIs, and the token's `iss`
      # claim all point at http://localhost:5180. Vite's dev-server
      # proxy (web/vite.config.ts) forwards /realms, /resources, /js
      # from there to https://localhost:8443 (nginx → Keycloak),
      # bypassing the self-signed-cert handshake that Firefox refuses
      # to do without manual user intervention.
      #
      # Browser-to-Keycloak path  : http://localhost:5180 → Vite → nginx (8443) → Keycloak
      # Backend-to-Keycloak path  : http://localhost:5180 → Vite → nginx (8443) → Keycloak  (JWKS only)
      # Internal nginx → Keycloak : http://hcm-keycloak:8090
      #
      # Production swap: set KC_HOSTNAME_URL to the real public URL
      # (e.g. https://auth.example.com) with a CA-signed cert + drop
      # the Vite proxy entries — same architecture as M33 originally
      # intended, just with a real cert instead of self-signed.
      KC_HOSTNAME_URL: http://localhost:5180
      KC_HOSTNAME_ADMIN_URL: http://localhost:5180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      # --- Realm sslRequired substitution ---
      # Plain-HTTP browser traffic (via Vite) means sslRequired=external
      # would refuse every login attempt with "HTTPS required" because
      # Keycloak only treats the loopback address as exempt. Drop to
      # `none` for dev; production flips back to `external` once a real
      # cert + KC_HOSTNAME_URL=https://… are in place.
      KC_REALM_SSL_REQUIRED: none
      # Health endpoints — production mode exposes /health, /metrics on the
      # management interface (port 9000) only when explicitly enabled.
      KC_HEALTH_ENABLED: "true"
    # Port 8090 is exposed to the host so the HCM backend (KeycloakAdminService)
    # can call the Admin REST API directly via HTTP without needing to go through
    # the nginx TLS terminator.  Direct loopback access (127.0.0.1:8090) bypasses
    # Keycloak's sslRequired:external check for the master realm.
    # nginx still serves browser traffic on :8443 → http://hcm-keycloak:8090.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./keycloak/realm-millers-hcm.json:/opt/keycloak/data/import/realm-millers-hcm.json:ro
      # Custom login theme — Keycloak picks up any subdirectory of
      # /opt/keycloak/themes/ as a selectable theme. The realm's
      # loginTheme setting names "millers" (set via kcadm after first
      # import). Re-mounted read-only so accidental edits inside the
      # container don't drift from the source-of-truth on disk.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # `start` exposes /health on the same HTTP port when KC_HEALTH_ENABLED.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: hcm-nginx
    # TLS terminator in front of Keycloak (PRD 14.6 — milestone 28).
    # Browser hits https://localhost:8443 → nginx → http://hcm-keycloak:8090.
    # The backend on the host keeps using http://localhost:8090 directly,
    # which is why Keycloak's HTTP port is still exposed alongside this.
    # Production guidance (in README): retire the :8090 host exposure,
    # flip KC_REALM_SSL_REQUIRED=external, replace the self-signed cert.
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8443:443"
      - "8444:80"   # plain-HTTP → HTTPS redirect entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./nginx/certs/localhost.key:/etc/nginx/certs/localhost.key:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate",
             "https://localhost/realms/millers-hcm/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  openldap:
    image: osixia/openldap:1.5.0
    container_name: hcm-openldap
    # M54 (PRD §14.6): OpenLDAP dev directory — Keycloak federates from this.
    # osixia/openldap creates the root dc=millers,dc=az entry automatically.
    # bootstrap.ldif seeds ou=users, ou=groups, 4 test users, and 5 role groups.
    # Group CN names match Keycloak realm role names so role-ldap-mapper resolves
    # them without a transform.
    command: ["--loglevel", "warning", "--copy-service"]
    ports:
      - "127.0.0.1:1389:389"
    environment:
      LDAP_ORGANISATION: "Millers HCM"
      LDAP_DOMAIN: millers.az
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_CONFIG_PASSWORD: configpassword
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "false"
    volumes:
      - ./docker/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif:ro
      - hcm-ldapdata:/var/lib/ldap
      - hcm-ldap-slapd:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=millers,dc=az -D cn=admin,dc=millers,dc=az -w adminpassword -s base > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clamav:
    image: clamav/clamav:stable
    container_name: hcm-clamav
    # M50 (PRD 14.8): ClamAV daemon for virus scanning uploaded files.
    # clamd listens on TCP 3310 inside the container.
    # First start downloads the virus-definition DB via freshclam (~250 MB);
    # subsequent starts reuse the persisted DB volume — much faster.
    # Spring's ClamAvScanService connects on localhost:3310 (port mapped below).
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - hcm-clamavdb:/var/lib/clamav
    environment:
      # Disable the built-in scanner health check (it calls clamscan, which is
      # slow); clamd health is checked via the TCP port below instead.
      CLAMAV_NO_CLAMDCONF: "false"
    healthcheck:
      # nc (netcat) is not in the minimal image; use /dev/tcp bash built-in.
      test:
        - CMD-SHELL
        - "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG"
      interval: 30s
      timeout: 10s
      retries: 5
      # freshclam must finish downloading the DB before clamd starts:
      # Alpine freshclam download is ~4 min on a first pull.
      start_period: 300s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: hcm-clickhouse
    # M58: Materialized analytics warehouse (PRD Could-Have).
    # Spring WarehouseEtlService talks to the HTTP interface on 18123.
    # Native TCP exposed on 19000 for CLI / DBeaver access.
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: hcm_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - hcm-clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # M164 — Loki log aggregation (PRD §18.3)
  loki:
    image: grafana/loki:2.9.8
    container_name: hcm-loki
    # Single-process mode: no separate ingester / querier; suitable for dev.
    # Production: use the distributed / microservices mode with S3 or GCS backend.
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - hcm-lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.8
    container_name: hcm-promtail
    # Scrapes Docker container log files and ships them to Loki.
    # /var/lib/docker/containers is mounted read-only; /run/docker.sock
    # is used for metadata enrichment (container name, labels).
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock
    # On macOS Docker Desktop the host path is different (/var/lib/docker
    # lives inside the VM); Promtail still works through the sock-based
    # service discovery path even when the log file path is inaccessible.

  # M167 — Jaeger distributed tracing backend (PRD §18.3)
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: hcm-jaeger
    # all-in-one bundles collector, query, and UI.
    # OTLP receiver on 4317 (gRPC) / 4318 (HTTP) receives spans from Spring Boot.
    # Jaeger UI on 16686 for trace browsing.
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4317:4317"    # OTLP gRPC — Spring Boot exporter endpoint
      - "4318:4318"    # OTLP HTTP — alternative exporter
      - "16686:16686"  # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ | grep -q 'Jaeger' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # M161 — Prometheus + Grafana monitoring stack (PRD §18.3)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: hcm-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hcm-prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.0.0
    container_name: hcm-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin12345}
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/hcm-overview.json
    ports:
      - "3001:3000"
    volumes:
      - hcm-grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  hcm-clickhousedata:
  hcm-prometheusdata:
  hcm-grafanadata:
  hcm-lokidata:
  hcm-pgdata:
  hcm-miniodata:
  hcm-clamavdb:
  # Retained for backward-compat references to the old volume name.
  # Production `start` mode (milestone 23) stores all auth state in
  # hcm-keycloak-pg; nothing meaningful lives under /opt/keycloak/data anymore.
  hcm-keycloakdata:
  hcm-keycloak-pgdata:
  # M54 (PRD §14.6): persisted OpenLDAP data directory.
  # Survives container restarts so Keycloak's already-imported users are not
  # re-created on every compose up.
  hcm-ldapdata:
  hcm-ldap-slapd:
  # MailHog stores captured mail in /maildir but the default image keeps
  # it ephemeral in-memory; restart wipes the inbox — desired for dev.
