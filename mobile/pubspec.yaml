name: millers_hcm
description: Millers HCM — mobile self-service app for employees and managers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Auth — Keycloak OIDC, Authorization Code + PKCE
  flutter_appauth: ^7.0.1        # mobile (Android / iOS / macOS)
  flutter_secure_storage: ^9.2.2 # mobile token storage
  crypto: ^3.0.3                 # web PKCE SHA-256
  local_auth: ^2.3.0             # M59: biometric login (fingerprint / Face ID)

  # HTTP
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI helpers
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
