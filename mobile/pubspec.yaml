name: millers_hcm
description: Millers HCM — mobile self-service app for employees and managers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization delegates (M506 — en / az language toggle)
  flutter_localizations:
    sdk: flutter

  # Auth — Keycloak OIDC, Authorization Code + PKCE
  flutter_appauth: ^7.0.1        # mobile (Android / iOS / macOS)
  flutter_secure_storage: ^9.2.2 # mobile token storage
  crypto: ^3.0.3                 # web PKCE SHA-256
  local_auth: ^2.3.0             # M59: biometric login (fingerprint / Face ID)

  # Push notifications — Firebase Cloud Messaging (PRD §17.5 / M154)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # HTTP
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI helpers
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3

  # M496 / M508 — GPS capture for attendance clock-in + offline punch timestamps
  geolocator: ^13.0.1
  # M507 / M508 — lightweight local cache (offline read cache + punch queue).
  # Non-sensitive data only; salary/payslip data is never cached (see M507).
  shared_preferences: ^2.3.2

  # M504 — tap-to-call (tel:) / tap-to-email (mailto:) from the directory.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
