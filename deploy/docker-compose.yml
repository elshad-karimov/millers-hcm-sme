# ============================================================================
# Millers HCM — SME edition — VPS stack
#
# Lives ON THE VPS. `deploy-test.yml` / `deploy-prod.yml` ssh in, `cd` here and
# run:
#
#     docker compose up -d --no-build hcm-backend
#
# so the service MUST stay named `hcm-backend` and MUST take its tag from
# HCM_IMAGE_TAG. Only that service is rolled by a deploy; Postgres, Keycloak
# and Redis keep running untouched.
#
# ---------------------------------------------------------------------------
# TLS AND ROUTING ARE NOT HERE
#
# This box already runs a shared Caddy (`millerscrm-caddy-1`) that owns :80 and
# :443 and fronts every app on it, issuing certificates automatically. There is
# deliberately no nginx and no certbot in this file — a second thing binding
# :80 would fight Caddy for the ACME challenge and break every other site.
#
# Caddy joins each app's network and proxies by container name. Wire this stack
# in once (see deploy/Caddyfile.snippet):
#
#     docker network connect sme-net millerscrm-caddy-1
#
# ---------------------------------------------------------------------------
# COEXISTENCE WITH THE ENTERPRISE EDITION
#
# Every container is `sme-*` with its own Postgres, Keycloak and network, so
# nothing collides with the enterprise `hcm-*` stack. Host port bindings exist
# only on 127.0.0.1, for psql and the Keycloak admin console over an SSH
# tunnel; nothing here is reachable from the internet except through Caddy.
#
#     postgres 5533   keycloak-pg 5534   keycloak 8190   redis 6480   app 8083
#
# Copy env.example to .env and fill it in before the first start.
# ============================================================================

name: hcm-sme

services:

  # ── The application: API + bundled SPA in one image ──────────────────────
  hcm-backend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/millers-hcm-sme:${HCM_IMAGE_TAG:-latest}
    container_name: sme-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Override the image default (-XX:+UseZGC -XX:MaxRAMPercentage=75).
      # ZGC's own footprint plus a 75% heap does not fit a 900M container: the
      # JVM died just after startup, restart-looping with exit code 0. This
      # matches the enterprise hcm-backend on the same box, which has run for
      # days at ~115M with G1 and a 55% heap.
      JAVA_OPTS: "-XX:MaxRAMPercentage=55 -Djava.security.egd=file:/dev/./urandom -Dserver.port=8080"
      # The image EXPOSEs 8080 and the deploy job probes 8080 inside the
      # container; the app defaults to 8083, so pin it.
      SERVER_PORT: "8080"

      # application.yml hardcodes the dev datasource. Spring's relaxed binding
      # lets these env vars override it without a placeholder in the file.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hcm
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

      # Must equal what the BROWSER uses: it is the `iss` claim the multi-issuer
      # resolver matches against config.tenant.issuer_uri.
      HCM_OIDC_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL}/realms/millers-hcm
      HCM_KEYCLOAK_ADMIN_URL: http://keycloak:8090
      HCM_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      HCM_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      HCM_PREBOARDING_BASE_URL: ${PUBLIC_URL}/preboarding

      HCM_REDIS_HOST: redis
      HCM_REDIS_PORT: "6379"

      # AES key for encrypted PII columns (national id, bank details).
      # LOSING OR CHANGING THIS MAKES EXISTING ENCRYPTED ROWS UNREADABLE.
      # Keep a copy somewhere other than this VPS.
      HCM_SECURITY_DATA_KEY: ${HCM_SECURITY_DATA_KEY:?set HCM_SECURITY_DATA_KEY}

      HCM_MAIL_HOST: ${HCM_MAIL_HOST:-localhost}
      HCM_MAIL_PORT: ${HCM_MAIL_PORT:-1025}
      HCM_MAIL_FROM: ${HCM_MAIL_FROM:-no-reply@millers-software.com}

      # Off unless the box actually runs these services.
      HCM_STORAGE_MINIO_ENABLED: "${HCM_STORAGE_MINIO_ENABLED:-false}"
      HCM_VIRUS_SCAN_ENABLED: "${HCM_VIRUS_SCAN_ENABLED:-false}"
    ports:
      # Loopback only, for curl/debugging from the box. Caddy reaches the
      # container over the network, not through this binding.
      - "127.0.0.1:8083:8080"
    # REQUIRED, not a nicety. The image sets -XX:MaxRAMPercentage=75, which with
    # no limit sizes the heap off the HOST's RAM (3.8G here → ~2.8G heap) while
    # this shared box only has ~1.6G free. The JVM grows until the kernel
    # OOM-kills it, and the container restart-loops with exit code 0, which
    # looks like a clean shutdown rather than a kill. Mirrors the enterprise
    # hcm-backend's 900M limit; it runs at ~115M in practice.
    mem_limit: 900m
    memswap_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks: [sme]

  # ── Application data ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hcm
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5533:5432"
    volumes:
      - sme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d hcm"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sme]

  # ── Identity ──────────────────────────────────────────────────────────────
  keycloak-pg:
    image: postgres:16-alpine
    container_name: sme-keycloak-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    ports:
      - "127.0.0.1:5534:5432"
    volumes:
      - sme-keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sme]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: sme-keycloak
    restart: unless-stopped
    # `start` (not start-dev). The image runs its own build phase when KC_DB /
    # KC_HOSTNAME change, so --optimized is deliberately NOT used.
    command:
      - start
      - --import-realm
      - --http-port=8090
    depends_on:
      keycloak-pg:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-pg:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Advertise the PUBLIC url: the login form's action, the redirect URIs and
      # the token's `iss` all come from this. It must match HCM_OIDC_ISSUER's
      # origin or every token is rejected as untrusted.
      KC_HOSTNAME_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      KC_HOSTNAME_ADMIN_URL: ${PUBLIC_URL}
      KC_HTTP_ENABLED: "true"
      # Caddy terminates TLS and forwards X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      # Loopback only: reach the admin console over an SSH tunnel. Caddy does
      # not expose /admin publicly.
      - "127.0.0.1:8190:8090"
    volumes:
      - ../keycloak/realm-millers-hcm.json:/opt/keycloak/data/import/realm-millers-hcm.json:ro
      - ../keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8090 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks: [sme]

  redis:
    image: redis:7.2-alpine
    container_name: sme-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6480:6379"
    volumes:
      - sme-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sme]

volumes:
  sme-pgdata:
  sme-keycloak-pgdata:
  sme-redisdata:

networks:
  sme:
    # Fixed name so `docker network connect sme-net millerscrm-caddy-1` is
    # stable regardless of the compose project directory.
    name: sme-net
