# ============================================================================
# Millers HCM — SME edition — VPS reverse proxy.
#
# One public hostname serves both halves, which is what makes the OIDC round
# trip work without CORS:
#
#     /realms/  /resources/  /js/   → Keycloak   (login, tokens, JWKS)
#     everything else                → the backend (REST API + bundled SPA)
#
# So PUBLIC_URL, KC_HOSTNAME_URL and HCM_OIDC_ISSUER all agree on one origin.
# ============================================================================

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr request_time=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Plain HTTP exists only to bounce to HTTPS.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Request-side headers: Keycloak's session cookies are large.
        large_client_header_buffers 4 32k;
        client_max_body_size        32m;

        # RESPONSE-side headers, which the line above does NOT cover. The
        # Keycloak login page returns several big Set-Cookie headers that
        # overflow the default 4k proxy buffer, and nginx answers 502 with
        # "upstream sent too big header". Small responses like JWKS fit and
        # keep working, so the failure looks like a broken login rather than a
        # proxy misconfiguration. This bit the dev stack — do not remove it.
        proxy_buffer_size           32k;
        proxy_buffers            8  32k;
        proxy_busy_buffers_size     64k;

        add_header X-Frame-Options           DENY              always;
        add_header X-Content-Type-Options    nosniff           always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Identity ────────────────────────────────────────────────────────
        location ~ ^/(realms|resources|js)/ {
            proxy_pass         http://keycloak:8090;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # The Keycloak admin console is not published. Reach it over an SSH
        # tunnel to 127.0.0.1:8190 instead of exposing it to the internet.
        location /admin/ {
            return 404;
        }

        # ── Application: REST API and the SPA it serves ─────────────────────
        location / {
            proxy_pass         http://hcm-backend:8080;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Payroll runs and report exports are slow by nature.
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
