apiVersion: 1

datasources:
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    jsonData:
      # Link Jaeger traces to Loki logs by trace ID so clicking a span
      # in the trace view jumps directly to the correlated log lines.
      tracesToLogsV2:
        datasourceUid: "loki"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
