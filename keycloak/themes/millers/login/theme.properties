#
# Millers HCM Keycloak login theme.
#
# Extends the bundled "keycloak.v2" theme (Keycloak 24's modern login UI)
# and layers our brand colors + logo on top via login.css. Only the
# pieces we want to override sit in ./resources — everything else
# (templates, i18n, JS) falls back to the parent.
#
parent=keycloak.v2

#
# Static asset overrides. The custom CSS file replaces the default
# Patternfly look with the Millers cream-on-purple palette. The logo
# image lives at /resources/img/logo.png and is wired into the
# template via the styles block below.
#
styles=css/login.css

#
# Locale defaults (English only for now; matches the realm).
#
locales=en
