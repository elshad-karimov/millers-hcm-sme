# nginx reverse proxy in front of Keycloak (PRD 14.6 — TLS hardening).
#
# Terminates TLS on :443 (mapped to host :8443) using the self-signed
# cert in /etc/nginx/certs. Forwards all paths to the in-network
# `hcm-keycloak:8090` HTTP listener. Keycloak already has
# `KC_PROXY_HEADERS=xforwarded` set, so it trusts X-Forwarded-* from
# this proxy and emits correct authorization redirects.
#
# Production guidance (documented in README):
#   1. Replace the self-signed cert with a real one (Let's Encrypt /
#      corporate CA / cloud LB cert).
#   2. Set `KC_REALM_SSL_REQUIRED=external` (realm JSON already takes
#      the env substitution).
#   3. Stop exposing Keycloak's :8090 HTTP port to the host — only the
#      nginx HTTPS listener should be public.
#   4. Add HSTS, OCSP stapling, and a stricter cipher suite below.

events {
    worker_connections  1024;
}

http {
    # Logging — minimal, dev-friendly.
    log_format proxy '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'upstream=$upstream_addr request_time=$request_time';
    access_log /var/log/nginx/access.log proxy;

    # Optional plain-HTTP → HTTPS redirect (handy for the manual
    # `curl http://...` typo path).
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Modern-ish defaults. Production would pin a stricter set + add HSTS.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Larger buffer + body so Keycloak's auth pages and admin console
        # work — they ship sizeable session cookies + JSON payloads.
        large_client_header_buffers 4 32k;
        client_max_body_size        16m;

        # RESPONSE-side headers, which the line above does NOT cover.
        # The login page returns several large Set-Cookie headers (KC_RESTART,
        # AUTH_SESSION_ID, KC_AUTH_SESSION_HASH); together they overflow the
        # default 4k proxy buffer and nginx answers 502 with
        # "upstream sent too big header". Small responses such as the JWKS
        # endpoint fit and keep working, so the failure looks like a broken
        # login rather than a proxy misconfiguration.
        proxy_buffer_size           32k;
        proxy_buffers            8  32k;
        proxy_busy_buffers_size     64k;

        location / {
            # SME edition's own Keycloak. The enterprise 'hcm-keycloak' is on a
            # separate compose network and is not reachable — nor wanted — here.
            proxy_pass         http://sme-keycloak:8090;
            proxy_http_version 1.1;

            # Keycloak relies on these to construct correct redirect URLs.
            # The KC_PROXY_HEADERS=xforwarded env on the Keycloak container
            # tells it to trust the X-Forwarded-* family.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host:8543;
            proxy_set_header X-Forwarded-Port  8543;

            # WebSocket upgrade isn't strictly required for Keycloak, but
            # admin console event-source streams benefit.
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
